[project]
name = "md2linkedin"
version = "0.4.0"
description = "Convert Markdown to LinkedIn-friendly Unicode text"
readme = "README.md"
authors = [
    { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["markdown", "linkedin", "unicode", "formatting", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
md2linkedin = "md2linkedin._cli:main"

[project.urls]
Homepage = "https://github.com/IndrajeetPatil/md2linkedin"
Documentation = "https://www.indrapatil.com/md2linkedin/"
Repository = "https://github.com/IndrajeetPatil/md2linkedin"
Issues = "https://github.com/IndrajeetPatil/md2linkedin/issues"
Changelog = "https://github.com/IndrajeetPatil/md2linkedin/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "add-trailing-comma>=4.0.0",
    "coverage>=7.16.1",
    "jupyter>=1.1.1",
    "mkdocstrings-python>=2.0.8",
    "mutmut>=3.8.0",
    "prek>=0.5.3",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-codspeed==5.0.3",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
    "ty>=0.0.82",
    "zensical>=0.0.63",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.ruff]
fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Required for compatibility with Ruff's formatter.
    "missing-trailing-comma",
    # Mutually exclusive with D211 and D212, respectively.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # This project uses a repository-level LICENSE instead of per-file notices.
    "CPY",
    # This package's output IS Unicode Mathematical characters; having them in
    # docstring examples and block-comment separators is intentional.
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    # Internal (underscore-prefixed) functions carry a description-only
    # docstring: no Args/Returns/Raises sections, which would only restate a
    # signature the reader is already looking at. See AGENTS.md. The public
    # API still documents its returns, raises and yields in full; these rules
    # cannot distinguish the two, so that part is upheld in review.
    "docstring-missing-returns",
    "docstring-missing-yields",
    "docstring-missing-exception",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # docstring requirements
    "D",
    # tests can use asserts
    "assert",
    # tests legitimately import private internals to test them directly
    "import-private-name",
    # test methods inside classes don't need @staticmethod — class grouping is intentional
    "no-self-use",
    # test assertions for Unicode output use the literal Unicode chars (intentional)
    "ambiguous-unicode-character-string",
    # magic numbers in assertions are fine (e.g. expected count == 3)
    "magic-value-comparison",
    # large test classes are fine when grouping related cases
    "too-many-public-methods",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.pytest.ini_options]
addopts = [
    # error on problems parsing pytest configuration
    "--strict-config",
    # error on using unregistered marker
    "--strict-markers",
    # show extra test summary info for everything
    "-ra",
    # include more verbose output
    "--verbose",
    # using pytest-random-order plugin option
    "--random-order",
]
testpaths = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
python_files = ["test_*.py", "test-*.py", "tests.py", "test.py"]

[tool.coverage.run]
branch = true
source = ["md2linkedin"]

[tool.coverage.report]
fail_under = 100
format = "markdown"
sort = "-Cover"
show_missing = true
skip_empty = true

[tool.mutmut]
source_paths = ["src/md2linkedin/"]
# The regression-gate tests import the comparator from this support package.
also_copy = ["scripts/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Only mutate lines exercised by the test suite so mutmut concentrates on
# meaningful mutations that the tests should actually catch.
mutate_only_covered_lines = true
# Skip mutations that cannot be detected by the tests in practice. The
# pattern is hoisted onto its own source line so the line-granularity
# exclusion below suppresses only the equivalence mutation described and
# not any other operations on the same statement.
# * ``closing_fence = rest.rfind(fence)`` on a fenced code block is
#   equivalent to ``rest.find(fence)`` because the non-greedy regex that
#   captured the block already trims to the shortest matching span, so
#   no additional ``fence`` marker can appear inside ``rest``.
# * ``pos = 0`` in ``_convert_bullets`` is equivalent to ``pos = None``
#   because the cursor is only ever used as the lower bound of a slice, and
#   ``text[None:i]`` is ``text[0:i]``. Every later assignment to it is an
#   integer, so no test can tell the two initial values apart.
# * ``previous_start = text.rfind("\n", 0, end) + 1`` in
#   ``_interrupts_paragraph`` is equivalent to the same call with ``None`` as
#   the lower bound, which is how ``str.rfind`` spells "from the beginning".
#   The line also carries a ``0`` → ``1`` mutation that is *not* equivalent;
#   ``test_block_above_is_read_at_the_top_of_the_document`` is the test that
#   catches it, so the behaviour stays pinned even though this exclusion
#   stops mutmut from generating that mutant.
#
# ``encoding=_ENCODING`` mutations (``encoding=None`` / arg-removal) are
# NOT excluded here — they are covered by focused tests that assert the
# UTF-8 argument is passed explicitly, so surviving mutants would show up
# as real test failures rather than being silently skipped.
do_not_mutate_patterns = [
    'closing_fence = rest\.rfind\(fence\)',
    'pos = 0',
    'previous_start = text\.rfind',
]

[tool.ty.src]
exclude = [".venv", "build", "dist", "docs"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.rules]
# Enable every current diagnostic, including soundness and suppression checks that
# ty leaves disabled by default. Pinning ty in uv.lock keeps new rules from arriving
# silently between dependency updates.
all = "error"

[tool.ty.analysis]
# Prefer sound narrowing over convenience assumptions at external-data boundaries.
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.uv]
required-version = ">=0.12.0"
