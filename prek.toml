minimum_prek_version = "0.4.1"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "f368fb366ff7f2f808dd324b83a6d32267799e19"  # frozen: v0.17.2
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "44e0d809f7977451fe65f3697106f594b0a02492"  # frozen: v0.0.91
hooks = [
  { id = "ty" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--unsafe"] },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
