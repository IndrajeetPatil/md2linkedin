minimum_prek_version = "0.4.1"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "ef6cf06c079dd6b299dfc720b0f14400c9d168e1"  # frozen: v0.17.5
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "d598b95ef3cba3cf3a31c40620c3481ae978e4eb"  # frozen: v0.0.104
hooks = [
  { id = "ty" },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml", args = ["--unsafe"] },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "fix-byte-order-marker" },
  { id = "no-commit-to-branch", args = ["--branch=main"] },
]
