minimum_prek_version = "0.5.11"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "meta"

[[repos.hooks]]
id = "check-useless-excludes"

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "9026c9127e153371d7a78dfcb0c45ae2046a3d10" # frozen: v0.17.6

[[repos.hooks]]
id = "ruff-check"
args = ["--fix"]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "85bff61a55f10dcc0a58fff7f9ee5bf83d1dc419" # frozen: v0.0.110

[[repos.hooks]]
id = "ty"

[[repos]]
repo = "https://github.com/Apakottur/unref-pre-commit"
rev = "4310b723fdfd8aee12b897cdf9a120c54ec35050" # frozen: v0.5.1

[[repos.hooks]]
id = "unref"
args = ["--show-transitive"]

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-json"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]

[[repos.hooks]]
id = "check-added-large-files"
args = ["--enforce-all"]

[[repos.hooks]]
id = "detect-private-key"

[[repos.hooks]]
id = "fix-byte-order-marker"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-illegal-windows-names"

[[repos.hooks]]
id = "check-executables-have-shebangs"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"

[[repos.hooks]]
id = "check-symlinks"

[[repos.hooks]]
id = "destroyed-symlinks"

[[repos.hooks]]
id = "forbid-new-submodules"

[[repos.hooks]]
id = "check-vcs-permalinks"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch=main"]
