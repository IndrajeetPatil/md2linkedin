name: Mutation Testing

on:
  # Only run on demand, on schedule, and on PRs that actually change the
  # mutation-testing configuration — full mutmut runs are slow, so we avoid
  # burning CI minutes on every PR.
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 07:17 UTC.
    - cron: "17 7 * * 1"
  pull_request:
    paths:
      - ".github/workflows/mutation-test.yml"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  mutmut:
    name: Run mutmut
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: |
          uv python install
          uv sync --all-extras --dev

      - name: Run mutation tests
        run: make mutation-test

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-report
          path: mutants/
          if-no-files-found: ignore
